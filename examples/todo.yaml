openapi: 3.1.0
info:
  title: Todo
  version: 1.0.0
  description: A tiny to-do list API, to try APIForge in a minute.
tags:
  - name: todos
paths:
  /todos:
    get:
      operationId: listTodos
      tags: [todos]
      summary: List to-dos
      parameters:
        - name: done
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The to-dos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      tags: [todos]
      summary: Add a to-do
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Todo"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
  /todos/{todoId}:
    parameters:
      - name: todoId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTodo
      tags: [todos]
      summary: Get a to-do
      responses:
        "200":
          description: The to-do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: Remove a to-do
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Todo:
      type: object
      required: [title]
      properties:
        id:
          type: integer
          readOnly: true
          examples: [1]
        title:
          type: string
          minLength: 1
          maxLength: 200
          examples: [Write the release notes]
        done:
          type: boolean
          default: false
        due:
          type: string
          format: date
          examples: ["2026-11-02"]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
