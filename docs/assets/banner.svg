<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open APIForge</title>
  <desc id="d">An OpenAPI spec in, a FastAPI project you can run, verify and keep out: models, routes, auth, tests, Docker and a fidelity check</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120e"/>
      <stop offset="1" stop-color="#0b1c16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#ecfdf5" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open APIForge</text>
    <text x="74" y="186" fill="#a7d7c5" font-size="22" font-weight="400">An OpenAPI spec in. A FastAPI project you keep, out.</text>
    <text x="74" y="246" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7fb5a2" xml:space="preserve">pydantic v2<tspan fill="#1f4537">  /  </tspan>auth<tspan fill="#1f4537">  /  </tspan>tests<tspan fill="#1f4537">  /  </tspan>--db crud<tspan fill="#1f4537">  /  </tspan>safe regeneration</text>
  </g>

  <!-- A spec card on the left, a generated file tree on the right, joined by a beam -->
  <g transform="translate(790 46)" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11">
    <circle cx="300" cy="114" r="140" fill="url(#halo)"/>

    <g>
      <rect x="0" y="18" width="170" height="192" rx="12" fill="#10251d"/>
      <text x="14" y="42" fill="#6ee7b7">openapi.yaml</text>
      <text x="14" y="66" fill="#a7d7c5">openapi: 3.1.0</text>
      <text x="14" y="84" fill="#a7d7c5">paths:</text>
      <text x="26" y="102" fill="#d1fae5">/pets:</text>
      <text x="38" y="120" fill="#7fb5a2">get: listPets</text>
      <text x="38" y="138" fill="#7fb5a2">post: createPet</text>
      <text x="26" y="156" fill="#d1fae5">/pets/{petId}:</text>
      <text x="38" y="174" fill="#7fb5a2">get: getPet</text>
      <text x="14" y="196" fill="#4b7a69">components: ...</text>
    </g>

    <rect x="182" y="110" width="70" height="4" rx="2" fill="url(#beam)"/>
    <path d="M250 104 L262 112 L250 120 Z" fill="#34d399"/>

    <g transform="translate(270 0)">
      <rect x="0" y="0" width="200" height="228" rx="12" fill="#10251d"/>
      <text x="14" y="26" fill="#6ee7b7">my-api/</text>
      <g fill="#a7d7c5">
        <text x="24" y="50">app/generated/</text>
        <text x="38" y="68" fill="#7fb5a2">models.py</text>
        <text x="38" y="86" fill="#7fb5a2">routers/pets.py</text>
        <text x="38" y="104" fill="#7fb5a2">security.py</text>
        <text x="24" y="128">app/handlers/</text>
        <text x="38" y="146" fill="#d1fae5">pets.py</text>
        <text x="24" y="170">tests/</text>
        <text x="24" y="194">Dockerfile</text>
        <text x="24" y="214">apiforge.lock</text>
      </g>
      <rect x="140" y="135" width="46" height="16" rx="8" fill="#065f46"/>
      <text x="163" y="147" fill="#d1fae5" text-anchor="middle" font-size="10">yours</text>
      <rect x="128" y="39" width="64" height="16" rx="8" fill="#1f3b31"/>
      <text x="160" y="51" fill="#a7d7c5" text-anchor="middle" font-size="10">generated</text>
    </g>
  </g>
</svg>
