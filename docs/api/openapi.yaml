openapi: 3.1.0
info:
  title: Euron Open APIForge
  description: "\nTurn OpenAPI specs into FastAPI projects you can run, verify and keep. Upload a spec\
    \ to a\nproject (each upload is a version, linted and compared with the previous one), request a\n\
    generation, browse the generated files and download the archive. The archive is the same,\nbyte for\
    \ byte, as `apiforge generate --zip` produces for the same spec and options.\n\n* `/api/v1/*`: authenticate\
    \ with a session token (`POST /api/v1/auth/login`) or, for\n  read-only automation (for example a\
    \ CI job downloading the latest archive), an API key\n  (`Authorization: Bearer afk_...`).\n* `/metrics`:\
    \ Prometheus metrics.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Sign out
      description: 'Ends this session server-side too: the token is refused until it expires.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: The signed-in user
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
  /api/v1/auth/password:
    post:
      tags:
      - auth
      summary: Change your password
      operationId: password_api_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: List dashboard users
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
    post:
      tags:
      - users
      summary: Invite a dashboard user
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}:
    patch:
      tags:
      - users
      summary: Update a user's name, role or access
      operationId: update_user_api_v1_users__user_id__patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys:
    get:
      tags:
      - api keys
      summary: List API keys
      operationId: list_keys_api_v1_keys_get
      parameters:
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Revoked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyOut'
                title: Response List Keys Api V1 Keys Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - api keys
      summary: Create a key (shown once)
      operationId: create_key_api_v1_keys_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys/{key_id}:
    patch:
      tags:
      - api keys
      summary: Update a key's name, limit or expiry
      operationId: update_key_api_v1_keys__key_id__patch
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys/{key_id}/revoke:
    post:
      tags:
      - api keys
      summary: Revoke a key immediately
      operationId: revoke_key_api_v1_keys__key_id__revoke_post
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/overview:
    get:
      tags:
      - overview
      summary: Counts and recent activity
      operationId: overview_api_v1_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: Every project, latest first
      operationId: list_projects_api_v1_projects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectOut'
                type: array
                title: Response List Projects Api V1 Projects Get
    post:
      tags:
      - projects
      summary: Create a project
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}:
    get:
      tags:
      - projects
      summary: A project
      operationId: get_project_api_v1_projects__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - projects
      summary: Rename a project or change its defaults
      operationId: update_project_api_v1_projects__slug__patch
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - projects
      summary: Delete a project, its specs and archives
      operationId: delete_project_api_v1_projects__slug__delete
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/specs:
    post:
      tags:
      - projects
      summary: Upload a spec version (a .yaml or .json file, or a zip with relative $refs)
      operationId: upload_spec_api_v1_projects__slug__specs_post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_spec_api_v1_projects__slug__specs_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecUploaded'
        '200':
          description: This exact spec is already a version of the project
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - projects
      summary: Spec versions, newest first
      operationId: list_specs_api_v1_projects__slug__specs_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecVersionOut'
                title: Response List Specs Api V1 Projects  Slug  Specs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/specs/text:
    post:
      tags:
      - projects
      summary: Upload a spec version as text (what the web app's editor sends)
      operationId: upload_spec_text_api_v1_projects__slug__specs_text_post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LintIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecUploaded'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/specs/{number}:
    get:
      tags:
      - projects
      summary: 'A spec version: its report, operations, tags and security schemes'
      operationId: get_spec_api_v1_projects__slug__specs__number__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecVersionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/specs/{number}/content:
    get:
      tags:
      - projects
      summary: The spec's text
      operationId: spec_content_api_v1_projects__slug__specs__number__content_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecContent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/diff:
    get:
      tags:
      - projects
      summary: What changed between two spec versions
      operationId: spec_diff_api_v1_projects__slug__diff_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: base
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: Base
      - name: head
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: Head
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDiff'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/lint:
    post:
      tags:
      - projects
      summary: Lint a spec without saving it (the playground)
      operationId: lint_api_v1_lint_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LintIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LintOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/examples:
    get:
      tags:
      - projects
      summary: The example specs that ship with APIForge
      operationId: list_examples_api_v1_examples_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ExampleOut'
                type: array
                title: Response List Examples Api V1 Examples Get
  /api/v1/examples/{name}:
    get:
      tags:
      - projects
      summary: One bundled example spec, with its text
      operationId: get_example_api_v1_examples__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleSpecOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/from-example:
    post:
      tags:
      - projects
      summary: Create a project from a bundled example, with its spec as version 1
      operationId: from_example_api_v1_projects_from_example_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromExampleIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/generations:
    post:
      tags:
      - generations
      summary: Generate a project from a spec version (queued for the worker)
      operationId: create_generation_api_v1_projects__slug__generations_post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationIn'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - generations
      summary: Generations, newest first
      operationId: list_generations_api_v1_projects__slug__generations_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenerationOut'
                title: Response List Generations Api V1 Projects  Slug  Generations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/generations/{number}:
    get:
      tags:
      - generations
      summary: A generation and its files
      operationId: get_generation_api_v1_projects__slug__generations__number__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/generations/{number}/archive:
    get:
      tags:
      - generations
      summary: Download the generated project as a zip
      operationId: download_api_v1_projects__slug__generations__number__archive_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: The generated project
          content:
            application/zip: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{slug}/generations/{number}/file:
    get:
      tags:
      - generations
      summary: One file of a generated project
      operationId: get_file_api_v1_projects__slug__generations__number__file_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      - name: path
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 500
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit:
    get:
      tags:
      - audit
      summary: Append-only audit log
      operationId: list_audit_api_v1_audit_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AuditOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      tags:
      - system
      summary: Liveness
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /health:
    get:
      tags:
      - system
      summary: Liveness (alias of /healthz)
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /readyz:
    get:
      tags:
      - system
      summary: 'Readiness: Postgres reachable (Redis too, when configured)'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readyz Readyz Get
  /api/v1/system:
    get:
      tags:
      - system
      summary: Deployment configuration
      operationId: system_api_v1_system_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
components:
  schemas:
    Ack:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: Ack
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        actor_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Email
        action:
          type: string
          title: Action
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        details:
          additionalProperties: true
          type: object
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_id
      - actor_email
      - action
      - target_type
      - target_id
      - details
