# ─────────────────────────────────────────────────────────────────────────────
# Euron Open APIForge: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4610   api 4630   postgres 4642   redis 4679   floci 4666
#
# The api, worker and migrate services share one image (infra/docker/api.Dockerfile),
# which carries the generator package (apps/forge) and the service (apps/api).
# ─────────────────────────────────────────────────────────────────────────────
name: apiforge

x-api-image: &api-image
  build:
    # The repository root: the image installs apps/forge and apps/api together.
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: apiforge-api:local

x-api-env: &api-env
  # Development mode skips the production boot guards: the local stack talks to an
  # emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  APIFORGE_CLOUD: local
  LOG_LEVEL: ${AF_LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://apiforge:apiforge@postgres:5432/apiforge
  # Redis is optional for APIForge. Set AF_REDIS_URL= (empty) in .env to run the
  # whole stack without it: caches and rate limits then run in process (the redis
  # container still starts, unused).
  REDIS_URL: ${AF_REDIS_URL-redis://redis:6379/0}
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  # Uploaded specs (specs/) and generated archives (archives/) on a named volume.
  # compose.floci.yaml switches this to S3 on the emulator.
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/artifacts
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${AF_WEB_PORT:-4610},http://127.0.0.1:${AF_WEB_PORT:-4610}
  # Password of the demo users `make demo` seeds (apiforge-server seed-demo).
  DEMO_PASSWORD: ${AF_DEMO_PASSWORD:?run `make env` first}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: apiforge
      POSTGRES_USER: apiforge
      POSTGRES_PASSWORD: apiforge
    ports:
      - "127.0.0.1:${AF_PG_PORT:-4642}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiforge -d apiforge"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rate-limit windows and short-lived caches shared between api replicas. Optional:
  # losing it costs a cache miss or a briefly relaxed rate limit, never data (Postgres
  # holds users, projects, generations and sessions).
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${AF_REDIS_PORT:-4679}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: apply Alembic migrations before anything that reads the schema starts.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # REST API, spec uploads and archive downloads; enqueues generation jobs.
  api:
    <<: *api-image
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${AF_API_PORT:-4630}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs generation jobs: validates the spec, renders and formats the FastAPI project in
  # memory, and stores the zip. It never runs the generated code.
  worker:
    <<: *api-image
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: apiforge-web:local
    environment:
      # Server-side only: Next rewrites /api/* to the API on the Compose network, so the
      # browser talks to one origin (no CORS, first-party cookies).
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${AF_WEB_PORT:-4610}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
