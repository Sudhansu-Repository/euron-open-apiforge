name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    name: full stack on Floci (demo data, backend matrix, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The same files `make up` uses, for the steps that read logs without following them.
      COMPOSE: docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml -f deploy/compose/compose.floci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Start the stack (Terraform applies local-floci inside compose)
        run: make up
      - name: Demo users, projects and generations (the worker generates the archives)
        run: make demo
      - name: Integration suite under every cache and storage backend
        run: make test-matrix
      - name: Browser end-to-end tests
        run: make e2e
      - name: Browser QA sweep
        run: make qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            scripts/qa/output
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail 300
      - if: always()
        run: make down
