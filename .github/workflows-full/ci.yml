name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: sanitization and OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-sanitization.sh
      - uses: astral-sh/setup-uv@v10
      - name: OpenAPI reference matches the app
        working-directory: apps/api
        run: uv sync --frozen && uv run pytest tests/unit/system/test_openapi_drift.py -q

  integration:
    name: integration tests (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge
          POSTGRES_DB: apiforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apiforge"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://apiforge:apiforge@localhost:5432/apiforge_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_CACHE: redis
      TEST_STORAGE: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/forge/uv.lock
      - run: uv python install 3.12 && uv sync --frozen
      - name: Unit and integration tests with an 85% coverage floor
        run: uv run pytest tests -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=85

  integration-no-redis:
    name: integration tests without Redis (in-process fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge
          POSTGRES_DB: apiforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apiforge"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://apiforge:apiforge@localhost:5432/apiforge_test
      TEST_CACHE: memory
      TEST_STORAGE: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/forge/uv.lock
      - run: uv python install 3.12 && uv sync --frozen
      - run: uv run pytest tests/integration -q -p no:warnings

  forge:
    name: generator tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/forge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/forge/uv.lock
      - run: uv python install 3.12 && uv sync --frozen
      - run: uv run pytest -q --cov=apiforge --cov-report=term-missing:skip-covered

  corpus:
    name: corpus (generate every bundled spec and run its gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/forge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/forge/uv.lock
      - run: uv python install 3.12 && uv sync --frozen
      - run: uv run pytest -m corpus
