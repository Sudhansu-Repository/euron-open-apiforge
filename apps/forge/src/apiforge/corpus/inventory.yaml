openapi: 3.0.3
info:
  title: Warehouse Inventory
  version: 1.4.0
  description: Stock items and suppliers for a small warehouse. A CRUD-heavy API.
servers:
  - url: https://inventory.example.com/api
security:
  - bearerAuth: []
tags:
  - name: items
    description: Stock items
  - name: suppliers
    description: Who we buy from
paths:
  /items:
    get:
      tags: [items]
      operationId: listItems
      summary: List stock items
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: category
          in: query
          description: Only items in this category
          schema:
            $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Items, sorted by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      tags: [items]
      operationId: createItem
      summary: Add a stock item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: The new item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [items]
      operationId: getItem
      summary: Get one item
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Unknown item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
    put:
      tags: [items]
      operationId: replaceItem
      summary: Replace an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: The item, replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Unknown item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
    patch:
      tags: [items]
      operationId: updateItem
      summary: Change some fields of an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
      responses:
        '200':
          description: The item, changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Unknown item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Remove an item
      responses:
        '204':
          description: Removed
        '404':
          description: Unknown item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
  /suppliers:
    get:
      tags: [suppliers]
      operationId: listSuppliers
      summary: List suppliers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
    post:
      tags: [suppliers]
      operationId: createSupplier
      summary: Add a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
      responses:
        '201':
          description: The supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
  /suppliers/{supplierId}:
    parameters:
      - name: supplierId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [suppliers]
      operationId: getSupplier
      summary: Get a supplier
      responses:
        '200':
          description: The supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '404':
          description: Unknown supplier
    delete:
      tags: [suppliers]
      operationId: deleteSupplier
      summary: Remove a supplier
      responses:
        '204':
          description: Removed
        '404':
          description: Unknown supplier
  /reports/stock-value:
    get:
      tags: [items]
      operationId: stockValue
      summary: Total stock value by category
      responses:
        '200':
          description: Value per category
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
                  format: double
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Category:
      type: string
      enum: [raw-material, component, finished-good, packaging]
    Item:
      type: object
      required: [sku, name, category, quantity]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{4}$'
          example: BOL-1024
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Steel bolt M8
        category:
          $ref: '#/components/schemas/Category'
        quantity:
          type: integer
          minimum: 0
          example: 1200
        unitCost:
          type: number
          minimum: 0
          example: 0.12
        location:
          type: object
          properties:
            aisle:
              type: string
            shelf:
              type: integer
        supplierId:
          type: integer
          nullable: true
        lastCountedOn:
          type: string
          format: date
    ItemPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: integer
          minimum: 0
        unitCost:
          type: number
          minimum: 0
    Supplier:
      type: object
      required: [name, country]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: Acme Fasteners
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: DE
        email:
          type: string
          format: email
        active:
          type: boolean
          default: true
    NotFound:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: No such item
