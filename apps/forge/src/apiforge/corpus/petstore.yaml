openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
  description: A pet shop's inventory API, the classic first example.
  license:
    name: MIT
servers:
  - url: https://petstore.example.com/v1
tags:
  - name: pets
    description: Everything about the pets in the shop
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          description: How many pets to return at most
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PetStatus'
        - name: tags
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A page of pets
          headers:
            X-Total-Count:
              description: Number of pets matching the filter
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      tags: [pets]
      operationId: createPet
      summary: Add a pet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: The pet was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '422':
          description: The pet is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [pets]
      operationId: getPet
      summary: Get a pet
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: No pet with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [pets]
      operationId: deletePet
      summary: Remove a pet
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The pet was removed
        '404':
          description: No pet with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PetStatus:
      type: string
      enum: [available, pending, sold]
    Pet:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Rex
        status:
          $ref: '#/components/schemas/PetStatus'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]*$'
        birthday:
          type: string
          format: date
          nullable: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
