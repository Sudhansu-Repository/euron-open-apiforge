[project]
name = "euron-apiforge"
version = "0.1.0"
description = "Euron Open APIForge: turn an OpenAPI spec into a FastAPI backend you can run, verify and regenerate without losing your code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "openapi-spec-validator>=0.7",
  # Formats the generated code, so output is stable across machines.
  "ruff>=0.15",
]

[project.scripts]
apiforge = "apiforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/apiforge/targets/fastapi/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "PT"]
ignore = ["S101", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "PT011", "PT018", "PT022"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: generates and runs real projects (slow, needs uv and network or a warm cache)"]
addopts = "-m 'not corpus'"
